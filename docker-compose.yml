services:
  backend:
    build:
      context: ./backend
    container_name: book-recommender-backend
    restart: unless-stopped
    expose:
      - "5000"
    networks:
      - book-network

  frontend:
    build:
      context: ./frontend
    container_name: book-recommender-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - book-network

  nginx:
    image: nginx:alpine
    container_name: book-recommender-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - book-network

networks:
  book-network:
    driver: bridge
